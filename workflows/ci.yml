name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  # On PRs, GitHub checks out a synthetic merge commit by default. That hash
  # never exists in the developer's repo, so we pin to the real PR head commit.
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # ---------------------------------------------------------------- Job 1
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
          pip install pytest

      - name: Run tests
        run: pytest backend/tests/

  # ---------------------------------------------------------------- Job 2
  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------- Job 3
  provenance:
    name: Generate evidence.json
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: ${{ always() }}   # must run even when Jobs 1/2 fail, so failures get recorded
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Build .gitguardian/evidence.json (Schema v1)
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail

          COMMIT="$(git rev-parse HEAD)"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          mkdir -p .gitguardian
          RECORDS='[]'

          # add_record <type> <result> <source>
          add_record() {
            RECORDS="$(jq -c \
              --arg commit "$COMMIT" \
              --arg type "$1" \
              --arg result "$2" \
              --arg ts "$TIMESTAMP" \
              --arg source "$3" \
              --arg ref "$RUN_URL" \
              '. + [{commit: $commit, type: $type, result: $result,
                     timestamp: $ts, source: $source, reference: $ref}]' \
              <<< "$RECORDS")"
          }

          # Only "success" => passed, only "failure" => failed.
          # skipped / cancelled => NO record (missing metadata is never "passed").
          record_job() {
            case "$2" in
              success) add_record "$1" passed "$3" ;;
              failure) add_record "$1" failed "$3" ;;
              *) echo "::warning::$3 finished as '$2'; no evidence record written" ;;
            esac
          }

          record_job unit        "$BACKEND_RESULT"  "GitHub Actions run ${GITHUB_RUN_ID} - backend pytest"
          record_job integration "$FRONTEND_RESULT" "GitHub Actions run ${GITHUB_RUN_ID} - frontend build"

          jq -n --argjson records "$RECORDS" \
            '{schema_version: 1, records: $records}' > .gitguardian/evidence.json

          jq -e '.schema_version == 1 and (.records | type == "array")' \
            .gitguardian/evidence.json > /dev/null
          echo "Generated evidence for ${COMMIT}:"
          cat .gitguardian/evidence.json

      - name: Upload evidence.json
        uses: actions/upload-artifact@v4
        with:
          name: evidence-json
          path: .gitguardian/evidence.json
          include-hidden-files: true   # the file lives in a dot-directory
          if-no-files-found: error